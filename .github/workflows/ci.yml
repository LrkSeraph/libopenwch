# Continuous integration for libopenwch.
#
# The matrix has two axes on purpose:
#
#   toolchain — libopenwch must build with any bare-metal RISC-V GCC, not just
#               the one the maintainer happens to have.  The three entries
#               cover the Debian/Kali package, the xpack build that ch32fun
#               recommends, and the vendor-neutral `riscv64-elf` naming.
#
#   target    — every family must build, and the two families must be able to
#               build in the same `make` invocation, which is what catches an
#               accidental cross-family dependency.
#
# The API smoke tests are run for both families: they compile every public
# function with the library's own strict warning set plus -Werror and link the
# result, so a broken prototype or a missing object fails CI rather than a
# user's board.
#
# A fourth job builds libopenwch-examples, a separate repository, against this
# checkout.  The examples are the only consumer of the library that is not part
# of it, so they are what notices when a public interface changes underneath
# somebody.

name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

defaults:
  run:
    # `bash -e` treats a pipeline as successful when its *last* command
    # succeeds, so without pipefail a failing `make ... | tee` would report
    # success -- and every build step here records its output that way.
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  build:
    name: ${{ matrix.target }} on ${{ matrix.toolchain.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - name: debian
            prefix: riscv64-unknown-elf
            install: apt
          - name: xpack
            prefix: riscv-none-elf
            install: xpack
          - name: plain-elf
            prefix: riscv64-elf
            install: apt
        target:
          - ch32v0
          - ch5xx58x

    env:
      # Every build step appends here so the failure step below can surface the
      # actual compiler/linker error.  A literal path, deliberately: the runner
      # context does not exist at job level, and referencing it there makes the
      # whole workflow fail to validate.
      BUILD_LOG: /tmp/libopenwch-build.log

    steps:
      - uses: actions/checkout@v4

      - name: Install the Debian toolchain
        if: matrix.toolchain.install == 'apt'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf
          # The plain-elf prefix is not packaged; symlink the Debian one so
          # that the probe chain exercises a different name.
          if [ "${{ matrix.toolchain.prefix }}" = "riscv64-elf" ]; then
            sudo ln -sf /usr/bin/riscv64-unknown-elf-gcc       /usr/local/bin/riscv64-elf-gcc
            sudo ln -sf /usr/bin/riscv64-unknown-elf-ar        /usr/local/bin/riscv64-elf-ar
            sudo ln -sf /usr/bin/riscv64-unknown-elf-objcopy   /usr/local/bin/riscv64-elf-objcopy
            sudo ln -sf /usr/bin/riscv64-unknown-elf-objdump   /usr/local/bin/riscv64-elf-objdump
            sudo ln -sf /usr/bin/riscv64-unknown-elf-size      /usr/local/bin/riscv64-elf-size
            sudo ln -sf /usr/bin/riscv64-unknown-elf-nm        /usr/local/bin/riscv64-elf-nm
            sudo ln -sf /usr/bin/riscv64-unknown-elf-as        /usr/local/bin/riscv64-elf-as
          fi

      - name: Install the xpack toolchain
        if: matrix.toolchain.install == 'xpack'
        env:
          # xpack versions carry a fourth field; "14.2.0-3" does not exist and
          # is not the same release as "14.2.0-3.1".
          XPACK_VERSION: 14.2.0-3.1
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP" xpm
          "$RUNNER_TEMP/node_modules/.bin/xpm" install --global \
            "@xpack-dev-tools/riscv-none-elf-gcc@$XPACK_VERSION"
          # The store layout is
          #   <store>/@xpack-dev-tools/riscv-none-elf-gcc/<version>/.content/bin
          # but the store root differs between platforms and xpm versions, so
          # find the directory instead of assuming one.
          bindir=$(find "$HOME/.local/xPacks" -maxdepth 5 -type d -name bin 2>/dev/null | head -n1)
          if [ -z "$bindir" ]; then
            echo "xpack installed but no bin/ directory was found" >&2
            exit 1
          fi
          echo "xpack bin: $bindir"
          echo "$bindir" >> "$GITHUB_PATH"

      - name: Report the toolchain
        run: |
          ${{ matrix.toolchain.prefix }}-gcc --version | head -1
          ${{ matrix.toolchain.prefix }}-gcc -dumpversion

      - name: Device database tests
        run: make genlinktests PREFIX=${{ matrix.toolchain.prefix }} 2>&1 | tee -a "$BUILD_LOG"

      - name: Build the library
        run: make TARGETS=${{ matrix.target }} PREFIX=${{ matrix.toolchain.prefix }} 2>&1 | tee -a "$BUILD_LOG"

      - name: API smoke test
        run: make apitest TARGETS=${{ matrix.target }} PREFIX=${{ matrix.toolchain.prefix }} 2>&1 | tee -a "$BUILD_LOG"

      - name: Report sizes
        if: success()
        run: |
          for a in lib/*.a; do
            echo "== $a"
            ${{ matrix.toolchain.prefix }}-size "$a" 2>/dev/null || \
              ${{ matrix.toolchain.prefix }}-nm --defined-only "$a" | \
              awk '$2=="T"' | wc -l | xargs echo "  public functions:"
          done

      # Downloading a raw job log through the API requires repository admin
      # rights, which a contributor debugging a PR does not have.  The step
      # summary and the error annotations are both readable without them, so
      # route the decisive lines there as well.
      - name: Report the failure
        if: failure()
        run: |
          {
            echo "### Toolchain"
            echo '```'
            ${{ matrix.toolchain.prefix }}-gcc --version | head -1
            ${{ matrix.toolchain.prefix }}-gcc --print-multi-lib | head -20
            echo '```'
            echo "### Failure output (tail)"
            echo '```'
            tail -n 50 "$BUILD_LOG" 2>/dev/null || echo "no build log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -aE 'error:|cannot find|undefined reference|Error [0-9]' "$BUILD_LOG" 2>/dev/null \
            | head -n 5 | while IFS= read -r line; do
                echo "::error::$line"
              done

  nostdlib:
    name: freestanding (toolchain without newlib)
    runs-on: ubuntu-latest
    env:
      BUILD_LOG: /tmp/libopenwch-build.log
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf
      # Debian's gcc-riscv64-unknown-elf ships no newlib for any multilib, so a
      # link that pulls in -lc or -lgloss fails outright.  That makes this the
      # sharpest available test of the claim that libopenwch is freestanding:
      # if the library or the smoke tests ever start needing a C library, this
      # job breaks first.
      - name: Build the library and the mini-libc
        run: make 2>&1 | tee -a "$BUILD_LOG"
      # The ch5xx58x smoke test calls every ble_*() function, so this link also
      # proves the vendored WCH Bluetooth stack resolves -- on a toolchain with
      # no newlib at all, where the stack's memcpy() has to come from our
      # mini-libc.  The application examples are not here: they live in
      # libopenwch-examples, and the `examples` job below builds them against
      # this checkout.
      - name: API smoke tests (link with -nostdlib)
        run: make apitest 2>&1 | tee -a "$BUILD_LOG"
      - name: Report the failure
        if: failure()
        run: |
          {
            echo "### Failure output (tail)"
            echo '```'
            tail -n 50 "$BUILD_LOG" 2>/dev/null || echo "no build log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -aE 'error:|cannot find|undefined reference|Error [0-9]' "$BUILD_LOG" 2>/dev/null \
            | head -n 5 | while IFS= read -r line; do
                echo "::error::$line"
              done

  all-targets:
    name: both families in one make
    runs-on: ubuntu-latest
    env:
      BUILD_LOG: /tmp/libopenwch-build.log
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf
      # Building both in one invocation is what would catch a family-specific
      # flag or header leaking into the shared build.
      - name: Build both families in one make
        run: make TARGETS="ch32v0 ch5xx58x" 2>&1 | tee -a "$BUILD_LOG"
      - name: API smoke test for both families
        run: make apitest 2>&1 | tee -a "$BUILD_LOG"
      - name: Clean rebuild
        run: make clean && make 2>&1 | tee -a "$BUILD_LOG"
      - name: Report the failure
        if: failure()
        run: |
          {
            echo "### Failure output (tail)"
            echo '```'
            tail -n 50 "$BUILD_LOG" 2>/dev/null || echo "no build log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -aE 'error:|cannot find|undefined reference|Error [0-9]' "$BUILD_LOG" 2>/dev/null \
            | head -n 5 | while IFS= read -r line; do
                echo "::error::$line"
              done

  hygiene:
    name: no local paths or credentials in tracked files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A developer's absolute path in a committed file is a small leak that is
      # invisible in code review, and these repositories are public.  Cheap to
      # check here; expensive to discover later in the history.
      - name: No local paths or credentials in tracked files
        run: |
          fail=0
          if git grep -n -I -E '/home/[a-z]+/|/Users/[A-Za-z]+/|C:\\Users' -- . ; then
            echo "::error::a tracked file contains an absolute path from a developer's machine"
            fail=1
          fi
          if git grep -n -I -E 'BEGIN [A-Z ]*PRIVATE KEY|password[[:space:]]*=|api[_-]?key[[:space:]]*=|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' -- . ; then
            echo "::error::a tracked file looks like it contains a credential"
            fail=1
          fi
          if [ "$fail" != 0 ]; then exit 1; fi
          echo "no local paths or credentials in tracked files"

  # The examples are a separate project with its own CI, but they are also the
  # only code that consumes the library's public interface from outside, so
  # breakage that the smoke tests cannot see -- a macro that stopped being
  # exported, a driver whose setup sequence no longer builds -- shows up here
  # first.  This job deliberately builds the examples against *this* checkout,
  # not against a released revision.
  examples:
    name: integration test (libopenwch-examples)
    runs-on: ubuntu-latest
    env:
      BUILD_LOG: /tmp/libopenwch-examples.log
      # A literal URL so that a fork's CI tests the examples upstream, and not
      # a repository the fork's owner does not have.
      EXAMPLES_REPO: https://github.com/LrkSeraph/libopenwch-examples.git
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf

      # A clone failure is a real failure -- a renamed repository or a broken
      # network should be loud, not silently skipped.  A repository that is
      # reachable but still empty is the one case worth tolerating, so that
      # this job does not go red on unrelated commits while the examples are
      # being prepared.
      - name: Check out libopenwch-examples
        id: examples
        run: |
          git clone --depth 1 "$EXAMPLES_REPO" "$RUNNER_TEMP/examples"
          if [ -d "$RUNNER_TEMP/examples/examples" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=examples skipped::$EXAMPLES_REPO has no content yet; the integration test did not run."
            {
              echo "### Integration test skipped"
              echo "$EXAMPLES_REPO was cloned but contains no examples."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build the library
        if: steps.examples.outputs.found == 'true'
        run: make 2>&1 | tee -a "$BUILD_LOG"

      # OPENWCH_DIR is passed explicitly: the examples' own default is a
      # sibling checkout, which does not exist here.  It has to be passed to
      # `clean` as well, because every example's Makefile includes the rules
      # that need it even for that target.  Building one example at a time
      # keeps a failure attributable to the example that caused it.
      - name: Build every example against this checkout
        if: steps.examples.outputs.found == 'true'
        run: |
          for d in "$RUNNER_TEMP"/examples/examples/*/; do
            echo "== $(basename "$d")"
            make -C "$d" OPENWCH_DIR="$GITHUB_WORKSPACE" 2>&1 | tee -a "$BUILD_LOG"
            make -C "$d" OPENWCH_DIR="$GITHUB_WORKSPACE" clean
          done

      - name: Report the failure
        if: failure()
        run: |
          {
            echo "### Failure output (tail)"
            echo '```'
            tail -n 50 "$BUILD_LOG" 2>/dev/null || echo "no build log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -aE 'error:|cannot find|undefined reference|Error [0-9]' "$BUILD_LOG" 2>/dev/null \
            | head -n 5 | while IFS= read -r line; do
                echo "::error::$line"
              done
