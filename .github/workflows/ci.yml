# Continuous integration for libopenwch.
#
# The matrix has two axes on purpose:
#
#   toolchain — libopenwch must build with any bare-metal RISC-V GCC, not just
#               the one the maintainer happens to have.  The three entries
#               cover the Debian/Kali package, the xpack build that ch32fun
#               recommends, and the vendor-neutral `riscv64-elf` naming.
#
#   target    — every family must build, and the two families must be able to
#               build in the same `make` invocation, which is what catches an
#               accidental cross-family dependency.
#
# The API smoke tests are run for both families: they compile every public
# function with the library's own strict warning set plus -Werror and link the
# result, so a broken prototype or a missing object fails CI rather than a
# user's board.

name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.target }} on ${{ matrix.toolchain.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - name: debian
            prefix: riscv64-unknown-elf
            install: apt
          - name: xpack
            prefix: riscv-none-elf
            install: xpack
          - name: plain-elf
            prefix: riscv64-elf
            install: apt
        target:
          - ch32v0
          - ch5xx58x

    env:
      # Every build step appends here so the failure step below can surface the
      # actual compiler/linker error.  A literal path, deliberately: the runner
      # context does not exist at job level, and referencing it there makes the
      # whole workflow fail to validate.
      BUILD_LOG: /tmp/libopenwch-build.log

    steps:
      - uses: actions/checkout@v4

      - name: Install the Debian toolchain
        if: matrix.toolchain.install == 'apt'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf
          # The plain-elf prefix is not packaged; symlink the Debian one so
          # that the probe chain exercises a different name.
          if [ "${{ matrix.toolchain.prefix }}" = "riscv64-elf" ]; then
            sudo ln -sf /usr/bin/riscv64-unknown-elf-gcc       /usr/local/bin/riscv64-elf-gcc
            sudo ln -sf /usr/bin/riscv64-unknown-elf-ar        /usr/local/bin/riscv64-elf-ar
            sudo ln -sf /usr/bin/riscv64-unknown-elf-objcopy   /usr/local/bin/riscv64-elf-objcopy
            sudo ln -sf /usr/bin/riscv64-unknown-elf-objdump   /usr/local/bin/riscv64-elf-objdump
            sudo ln -sf /usr/bin/riscv64-unknown-elf-size      /usr/local/bin/riscv64-elf-size
            sudo ln -sf /usr/bin/riscv64-unknown-elf-nm        /usr/local/bin/riscv64-elf-nm
            sudo ln -sf /usr/bin/riscv64-unknown-elf-as        /usr/local/bin/riscv64-elf-as
          fi

      - name: Install the xpack toolchain
        if: matrix.toolchain.install == 'xpack'
        env:
          # xpack versions carry a fourth field; "14.2.0-3" does not exist and
          # is not the same release as "14.2.0-3.1".
          XPACK_VERSION: 14.2.0-3.1
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP" xpm
          "$RUNNER_TEMP/node_modules/.bin/xpm" install --global \
            "@xpack-dev-tools/riscv-none-elf-gcc@$XPACK_VERSION"
          # The store layout is
          #   <store>/@xpack-dev-tools/riscv-none-elf-gcc/<version>/.content/bin
          # but the store root differs between platforms and xpm versions, so
          # find the directory instead of assuming one.
          bindir=$(find "$HOME/.local/xPacks" -maxdepth 5 -type d -name bin 2>/dev/null | head -n1)
          if [ -z "$bindir" ]; then
            echo "xpack installed but no bin/ directory was found" >&2
            exit 1
          fi
          echo "xpack bin: $bindir"
          echo "$bindir" >> "$GITHUB_PATH"

      - name: Report the toolchain
        run: |
          ${{ matrix.toolchain.prefix }}-gcc --version | head -1
          ${{ matrix.toolchain.prefix }}-gcc -dumpversion

      - name: Device database tests
        shell: bash
        run: make genlinktests PREFIX=${{ matrix.toolchain.prefix }} 2>&1 | tee -a "$BUILD_LOG"

      - name: Build the library
        shell: bash
        run: make TARGETS=${{ matrix.target }} PREFIX=${{ matrix.toolchain.prefix }} 2>&1 | tee -a "$BUILD_LOG"

      - name: API smoke test
        shell: bash
        run: make apitest TARGETS=${{ matrix.target }} PREFIX=${{ matrix.toolchain.prefix }} 2>&1 | tee -a "$BUILD_LOG"

      - name: Report sizes
        if: success()
        run: |
          for a in lib/*.a; do
            echo "== $a"
            ${{ matrix.toolchain.prefix }}-size "$a" 2>/dev/null || \
              ${{ matrix.toolchain.prefix }}-nm --defined-only "$a" | \
              awk '$2=="T"' | wc -l | xargs echo "  public functions:"
          done

      # Downloading a raw job log through the API requires repository admin
      # rights, which a contributor debugging a PR does not have.  The step
      # summary and the error annotations are both readable without them, so
      # route the decisive lines there as well.
      - name: Report the failure
        if: failure()
        run: |
          {
            echo "### Toolchain"
            echo '```'
            ${{ matrix.toolchain.prefix }}-gcc --version | head -1
            ${{ matrix.toolchain.prefix }}-gcc --print-multi-lib | head -20
            echo '```'
            echo "### Failure output (tail)"
            echo '```'
            tail -n 50 "$BUILD_LOG" 2>/dev/null || echo "no build log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -aE 'error:|cannot find|undefined reference|Error [0-9]' "$BUILD_LOG" 2>/dev/null \
            | head -n 5 | while IFS= read -r line; do
                echo "::error::$line"
              done

  nostdlib:
    name: freestanding (toolchain without newlib)
    runs-on: ubuntu-latest
    env:
      BUILD_LOG: /tmp/libopenwch-build.log
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf
      # Debian's gcc-riscv64-unknown-elf ships no newlib for any multilib, so a
      # link that pulls in -lc or -lgloss fails outright.  That makes this the
      # sharpest available test of the claim that libopenwch is freestanding:
      # if the library, the smoke tests or the template ever start needing a C
      # library, this job breaks first.
      - name: Build the library and the mini-libc
        shell: bash
        run: make 2>&1 | tee -a "$BUILD_LOG"
      - name: API smoke tests (link with -nostdlib)
        shell: bash
        run: make apitest 2>&1 | tee -a "$BUILD_LOG"
      - name: Template with LIBOPENWCH_NOSTDLIB=1
        shell: bash
        run: |
          make -C template/examples/blink LIBOPENWCH_NOSTDLIB=1 2>&1 | tee -a "$BUILD_LOG"
          make -C template/examples/ch582_blink LIBOPENWCH_NOSTDLIB=1 2>&1 | tee -a "$BUILD_LOG"
      # The BLE example links WCH's closed-source stack, which is the only
      # place in this repository where a prebuilt third-party binary is part
      # of the link.  Building it here proves the vendored archive survives a
      # fresh checkout and resolves on a toolchain with no newlib at all --
      # the stack's own memcpy() comes from our mini-libc.
      - name: Bluetooth LE example (LIBOPENWCH_BLE=1)
        shell: bash
        run: make -C template/examples/ch582_ble_advertise 2>&1 | tee -a "$BUILD_LOG"
      - name: Report the failure
        if: failure()
        run: |
          {
            echo "### Failure output (tail)"
            echo '```'
            tail -n 50 "$BUILD_LOG" 2>/dev/null || echo "no build log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -aE 'error:|cannot find|undefined reference|Error [0-9]' "$BUILD_LOG" 2>/dev/null \
            | head -n 5 | while IFS= read -r line; do
                echo "::error::$line"
              done

  all-targets:
    name: both families in one make
    runs-on: ubuntu-latest
    env:
      BUILD_LOG: /tmp/libopenwch-build.log
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf
      # Building both in one invocation is what would catch a family-specific
      # flag or header leaking into the shared build.
      - name: Build both families in one make
        shell: bash
        run: make TARGETS="ch32v0 ch5xx58x" 2>&1 | tee -a "$BUILD_LOG"
      - name: API smoke test for both families
        shell: bash
        run: make apitest 2>&1 | tee -a "$BUILD_LOG"
      - name: Clean rebuild
        shell: bash
        run: make clean && make 2>&1 | tee -a "$BUILD_LOG"
      - name: Report the failure
        if: failure()
        run: |
          {
            echo "### Failure output (tail)"
            echo '```'
            tail -n 50 "$BUILD_LOG" 2>/dev/null || echo "no build log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -aE 'error:|cannot find|undefined reference|Error [0-9]' "$BUILD_LOG" 2>/dev/null \
            | head -n 5 | while IFS= read -r line; do
                echo "::error::$line"
              done
